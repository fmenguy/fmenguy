name: Statistiques d'activité

# Chaque matin, recalcule les graphiques et le tableau des commits du README, dépôts privés compris.
# Le secret ACTIVITE_TOKEN est un jeton à grain fin en lecture seule sur tous les dépôts
# (Contents : Read-only, Metadata : Read-only).

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calculer les statistiques
        run: node scripts/activite.mjs
        env:
          GH_TOKEN: ${{ secrets.ACTIVITE_TOKEN }}
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats
          git diff --cached --quiet || (git commit -m "Statistiques d'activité du jour" && git push)
